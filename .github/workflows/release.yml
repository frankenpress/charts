name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm dependency update
        run: |
          for chart in charts/*/; do
            helm dependency update "$chart"
          done

      - name: helm package + push to OCI
        run: |
          set -euo pipefail
          mkdir -p .release
          for chart in charts/*/; do
            helm package "$chart" --destination .release
          done
          for tgz in .release/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          done

      # GitHub-release-style chart-releaser as a backup distribution channel.
      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
