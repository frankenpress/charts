name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release from (defaults to current branch)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm dependency update
        run: |
          for chart in charts/*/; do
            helm dependency update "$chart"
          done

      - name: helm package + push to OCI
        run: |
          set -euo pipefail
          mkdir -p .release
          for chart in charts/*/; do
            helm package "$chart" --destination .release
          done
          for tgz in .release/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          done

      # OCI is our canonical distribution channel. We previously also
      # ran helm/chart-releaser-action as a github-release fallback, but
      # it requires a `gh-pages` branch we don't maintain — and OCI
      # gives consumers `helm install oci://ghcr.io/...` which is the
      # documented quickstart path.
