{{- if .Values.siteInstall.enabled }}
{{/*
  Hash-named tracked Job (was a `helm.sh/hook` resource pre-0.7.0).

  Why the change: ArgoCD translates `helm.sh/hook: post-install,post-upgrade`
  to its `PostSync` hook, and PostSync hook resources are NOT part of
  ArgoCD's drift detection. So values-only changes that *only* affect
  this Job's rendered content (e.g. flipping `siteInstall.activeTheme`)
  left the Application "Synced" and the Job never re-fired. Naming the
  Job by a hash of its inputs makes every meaningful change a new
  resource — ArgoCD sees it, syncs it, runs it. Vanilla-Helm consumers
  see the same effect: helm upgrade applies the new manifest, old Job
  is GC'd by `ttlSecondsAfterFinished`.

  Hash inputs (anything that can change the rendered Job spec):
    - .Chart.Version       — chart bumps that change the script
    - .Values.image.tag    — site image bumps trigger a fresh `wp core
                             update-db` against the new schema
    - .Values.image.repository
    - whole .Values.siteInstall — title, activeTheme, postDeployCommands,
                                   any future siteInstall.* additions
*/}}
{{- $hashInputs := printf "%s|%s|%s|%s" .Chart.Version .Values.image.tag .Values.image.repository (.Values.siteInstall | toJson) }}
{{- $hash := sha256sum $hashInputs | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-install-%s" (include "common.names.fullname" . | trunc 44 | trimSuffix "-") $hash }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: install
  annotations:
    # Run after the Deployment + most other tracked resources. The Job
    # has its own DB-readiness probe so it doesn't strictly need the
    # Deployment to be Healthy first, but a high wave keeps logs and
    # health-check ordering predictable in the ArgoCD UI.
    argocd.argoproj.io/sync-wave: "30"
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  # Auto-clean completed Jobs after 7 days. Each new hash creates a new
  # Job (old hash's Job stays around for the TTL window so failures are
  # debuggable). ArgoCD's Prune also picks up Jobs whose hash is no
  # longer in the rendered manifests.
  ttlSecondsAfterFinished: {{ .Values.siteInstall.ttlSecondsAfterFinished | default 604800 }}
  backoffLimit: {{ .Values.siteInstall.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.siteInstall.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "site.serviceAccountName" . }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: install
          image: {{ include "site.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/*
            Install Job containerSecurityContext = web Pod
            containerSecurityContext (PSA-restricted-compatible baseline)
            with siteInstall.containerSecurityContext overlaid on top.
            Web Pods keep readOnlyRootFilesystem: true; install Jobs flip
            it to false so `wp fp apply` can transiently `wp plugin install`
            WP-Importer (and, in future, any plugin a snapshot manifest
            declares it needs at apply time). The install Job is ephemeral;
            the overlay disappears with the pod. The image is never
            mutated.
          */}}
          securityContext: {{- mergeOverwrite (deepCopy .Values.containerSecurityContext) (default dict .Values.siteInstall.containerSecurityContext) | toYaml | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
{{ .Files.Get "files/scripts/install.sh" | indent 14 }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-env" (include "common.names.fullname" .) }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ tpl .Values.extraEnvVarsCM . }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ tpl .Values.extraEnvVarsSecret . }}
            {{- end }}
          env:
            # Install-Job-only opt-out of the in-cluster lockdown.
            # `config/application.php` in the site-template gates
            # DISALLOW_FILE_EDIT / DISALLOW_FILE_MODS on
            # `KUBERNETES_SERVICE_HOST AND !FP_ALLOW_FILE_MODS`. Setting
            # this to 1 here lets the install Job run `wp plugin
            # install` transiently (used by `wp fp apply` to bring up
            # WP-Importer just for the duration of snapshot apply).
            # Web Pods, wpcron CronJob, and the admin-credentials
            # initContainer never see this variable, so the lockdown
            # remains in force everywhere it matters.
            - name: FP_ALLOW_FILE_MODS
              value: "1"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.databaseSecretName" . }}
                  key: {{ include "site.databaseSecretPasswordKey" . }}
            - name: FP_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3AccessKeyKey" . }}
            - name: FP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3SecretKeyKey" . }}
            {{- range $name := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.secretName" $ }}
                  key: {{ $name }}
            {{- end }}
            - name: SITE_TITLE
              value: {{ .Values.siteInstall.title | quote }}
            # Conditional inputs for files/scripts/install.sh. Each is
            # consumed by a `[ -n "$VAR" ]` (or `[ "$VAR" = "1" ]`)
            # guard inside the script, so omitting the value from
            # values.yaml short-circuits the corresponding stage.
            - name: SKIP_EMAIL
              value: {{ ternary "1" "0" .Values.siteInstall.skipEmail | quote }}
            {{- if .Values.siteInstall.activeTheme }}
            - name: ACTIVE_THEME
              value: {{ .Values.siteInstall.activeTheme | quote }}
            {{- end }}
            {{- if .Values.siteInstall.snapshotsDir }}
            - name: SNAPSHOTS_DIR
              value: {{ .Values.siteInstall.snapshotsDir | quote }}
            {{- end }}
            {{- with .Values.siteInstall.postDeployCommands }}
            # One wp-cli arg string per line. The script reads with
            # `while IFS= read -r cmd` and `eval`s `$WP $cmd`, matching
            # the per-line `( set -x; $WP <cmd> )` rendering this replaced.
            - name: POST_DEPLOY_COMMANDS
              value: |
                {{- range . }}
                {{ . }}
                {{- end }}
            {{- end }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminUserKey" . }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminEmailKey" . }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminPasswordKey" . }}
            {{- include "site.smtpEnvFromSecret" . | nindent 12 }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.extraEnvVars "context" $ ) | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.tmp }}
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.data }}
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.config }}
{{- end }}
