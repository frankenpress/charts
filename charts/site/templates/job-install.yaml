{{- if .Values.siteInstall.enabled }}
{{/*
  Hash-named tracked Job (was a `helm.sh/hook` resource pre-0.7.0).

  Why the change: ArgoCD translates `helm.sh/hook: post-install,post-upgrade`
  to its `PostSync` hook, and PostSync hook resources are NOT part of
  ArgoCD's drift detection. So values-only changes that *only* affect
  this Job's rendered content (e.g. flipping `siteInstall.activeTheme`)
  left the Application "Synced" and the Job never re-fired. Naming the
  Job by a hash of its inputs makes every meaningful change a new
  resource — ArgoCD sees it, syncs it, runs it. Vanilla-Helm consumers
  see the same effect: helm upgrade applies the new manifest, old Job
  is GC'd by `ttlSecondsAfterFinished`.

  Hash inputs (anything that can change the rendered Job spec):
    - .Chart.Version       — chart bumps that change the script
    - .Values.image.tag    — site image bumps trigger a fresh `wp core
                             update-db` against the new schema
    - .Values.image.repository
    - whole .Values.siteInstall — title, activeTheme, postDeployCommands,
                                   any future siteInstall.* additions
*/}}
{{- $hashInputs := printf "%s|%s|%s|%s" .Chart.Version .Values.image.tag .Values.image.repository (.Values.siteInstall | toJson) }}
{{- $hash := sha256sum $hashInputs | trunc 8 }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-install-%s" (include "common.names.fullname" . | trunc 44 | trimSuffix "-") $hash }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: install
  annotations:
    # Run after the Deployment + most other tracked resources. The Job
    # has its own DB-readiness probe so it doesn't strictly need the
    # Deployment to be Healthy first, but a high wave keeps logs and
    # health-check ordering predictable in the ArgoCD UI.
    argocd.argoproj.io/sync-wave: "30"
    {{- if .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  # Auto-clean completed Jobs after 7 days. Each new hash creates a new
  # Job (old hash's Job stays around for the TTL window so failures are
  # debuggable). ArgoCD's Prune also picks up Jobs whose hash is no
  # longer in the rendered manifests.
  ttlSecondsAfterFinished: {{ .Values.siteInstall.ttlSecondsAfterFinished | default 604800 }}
  backoffLimit: {{ .Values.siteInstall.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.siteInstall.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "site.serviceAccountName" . }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: install
          image: {{ include "site.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{/*
            Install Job containerSecurityContext = web Pod
            containerSecurityContext (PSA-restricted-compatible baseline)
            with siteInstall.containerSecurityContext overlaid on top.
            Web Pods keep readOnlyRootFilesystem: true; install Jobs flip
            it to false so `wp fp apply` can transiently `wp plugin install`
            WP-Importer (and, in future, any plugin a snapshot manifest
            declares it needs at apply time). The install Job is ephemeral;
            the overlay disappears with the pod. The image is never
            mutated.
          */}}
          securityContext: {{- mergeOverwrite (deepCopy .Values.containerSecurityContext) (default dict .Values.siteInstall.containerSecurityContext) | toYaml | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              WP="wp --allow-root --path=/app/web/wp"

              # Direct mysqli probe — doesn't load WordPress, so it works
              # before `wp core install` has created wp_options. (`wp db *`
              # commands all bootstrap WP first and hard-fail with "site
              # not installed" on a fresh DB. `wp db check` also shells
              # out to `mysqlcheck` which isn't in the runtime image.)
              db_ready() {
                php -r '
                  $m = @new mysqli(
                    getenv("DB_HOST"),
                    getenv("DB_USER"),
                    getenv("DB_PASSWORD")
                  );
                  if ($m->connect_errno) { exit(1); }
                  $m->close();
                ' >/dev/null 2>&1
              }

              echo "[install] waiting for database..."
              for i in $(seq 1 60); do
                if db_ready; then
                  echo "[install] db ready (iter=$i)"
                  break
                fi
                sleep 2
              done
              # Fail fast if the wait loop never saw a healthy DB.
              db_ready || {
                echo "[install] database never became reachable; aborting"
                exit 1
              }

              if ! $WP core is-installed >/dev/null 2>&1; then
                echo "[install] running wp core install"
                $WP core install \
                  --url="$WP_HOME" \
                  --title="$SITE_TITLE" \
                  --admin_user="$ADMIN_USER" \
                  --admin_email="$ADMIN_EMAIL" \
                  --admin_password="$ADMIN_PASSWORD" \
                  {{- if .Values.siteInstall.skipEmail }}
                  --skip-email
                  {{- end }}
              else
                echo "[install] core already installed; skipping"
              fi

              echo "[install] running core update-db (idempotent)"
              $WP core update-db

              {{- if .Values.siteInstall.activeTheme }}
              # Theme activation. Idempotent — wp_options.{template,stylesheet}
              # already matching is a no-op. `--skip-themes` so a previously
              # broken active theme doesn't fatal WP load before we can switch
              # away from it (recovery path after a botched paid-theme release).
              # `set -x` echoes the resolved command before exec — avoids
              # nested-quote rendering issues in a manual `echo "..."` line.
              echo "[install] activating theme:"
              ( set -x; $WP --skip-themes theme activate {{ .Values.siteInstall.activeTheme | quote }} )
              {{- end }}

              {{- if .Values.siteInstall.snapshotsDir }}
              # FrankenPress snapshot apply. Iterates every subdir under
              # siteInstall.snapshotsDir whose manifest.json exists and
              # runs `wp fp apply --snapshot-dir=<dir>` per snapshot.
              #
              # `wp fp apply` (frankenpress/mu-plugin v0.8.0+) is
              # adapter-scoped + additive — uses WP-Importer for content,
              # update_option for scoped options, never DROP / DELETE /
              # TRUNCATE. Idempotent via fp_snapshot_applied_ref +
              # fp_snapshot_applied_sha256 option markers; re-runs
              # short-circuit in <100ms.
              #
              # Snapshots are baked into the site image at build time
              # (committed in the site repo under web/imports/<slug>/);
              # no S3 fetch, no separate artefact store. Adding /
              # changing snapshots flows through the normal site image
              # build path.
              SNAPSHOTS_DIR={{ .Values.siteInstall.snapshotsDir | quote }}
              if [ -d "$SNAPSHOTS_DIR" ]; then
                # Enforce the single-snapshot convention: at most one
                # snapshot directory with a manifest.json may exist
                # under SNAPSHOTS_DIR per release. Pre-Phase-2 the
                # loop iterated alphabetically and let last-write-win;
                # that quietly applied stale snapshots from forgotten
                # earlier releases alongside the canonical current
                # one, producing wrong-design-state renders.
                #
                # Convention: commit one snapshot dir per release under
                # web/imports/<slug>/, `git rm` the previous one in
                # the same PR. The install Job refuses to apply when
                # multiple snapshot dirs are present.
                manifest_count=$(find "$SNAPSHOTS_DIR" -mindepth 2 -maxdepth 2 -name manifest.json -type f 2>/dev/null | wc -l | tr -d ' ')
                if [ "$manifest_count" -gt 1 ]; then
                  echo "[snapshot] ERROR: $manifest_count snapshot directories with manifest.json under $SNAPSHOTS_DIR — the convention is one snapshot per release."
                  echo "[snapshot] Snapshot directories found:"
                  find "$SNAPSHOTS_DIR" -mindepth 2 -maxdepth 2 -name manifest.json -type f 2>/dev/null | xargs -n1 dirname
                  echo "[snapshot] Remove stale snapshot dirs from the site repo (web/imports/<old-slug>/) and re-tag. Apply will not proceed until this is resolved."
                  exit 1
                fi

                # Subdir count drives the "no snapshots committed yet"
                # log line below. The for-loop's manifest.json gate
                # skips .gitkeep-only subdirs.
                snap_count=$(find "$SNAPSHOTS_DIR" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
                if [ "$snap_count" -eq 0 ]; then
                  echo "[snapshot] no snapshot directories under $SNAPSHOTS_DIR (designer hasn't committed any yet)"
                else
                  echo "[snapshot] processing $snap_count snapshot directories under $SNAPSHOTS_DIR"
                  for snap_dir in "$SNAPSHOTS_DIR"/*/; do
                    [ -d "$snap_dir" ] || continue
                    if [ ! -f "${snap_dir}manifest.json" ]; then
                      echo "[snapshot] skipping ${snap_dir%/} (no manifest.json)"
                      continue
                    fi
                    echo "[snapshot] applying ${snap_dir%/}"
                    ( set -x; $WP fp apply --snapshot-dir="${snap_dir%/}" )
                  done
                fi
              else
                echo "[snapshot] $SNAPSHOTS_DIR not found; no snapshots in this image"
              fi
              {{- end }}

              {{- with .Values.siteInstall.postDeployCommands }}
              # Post-deploy commands. Run on every install + upgrade. Failures
              # exit the Job non-zero (Helm marks release failed; Deployment
              # itself is not rolled back — pod is already serving traffic).
              # Same `set -x`-in-a-subshell pattern: arbitrary wp-cli args
              # (which often contain `"` for PHP eval strings) print + run
              # cleanly without us hand-quoting each one.
              echo "[post-deploy] running {{ len . }} command(s):"
              {{- range . }}
              ( set -x; $WP {{ . }} )
              {{- end }}
              {{- end }}

              echo "[install] done"
          envFrom:
            - configMapRef:
                name: {{ printf "%s-env" (include "common.names.fullname" .) }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ tpl .Values.extraEnvVarsCM . }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ tpl .Values.extraEnvVarsSecret . }}
            {{- end }}
          env:
            # Install-Job-only opt-out of the in-cluster lockdown.
            # `config/application.php` in the site-template gates
            # DISALLOW_FILE_EDIT / DISALLOW_FILE_MODS on
            # `KUBERNETES_SERVICE_HOST AND !FP_ALLOW_FILE_MODS`. Setting
            # this to 1 here lets the install Job run `wp plugin
            # install` transiently (used by `wp fp apply` to bring up
            # WP-Importer just for the duration of snapshot apply).
            # Web Pods, wpcron CronJob, and the admin-credentials
            # initContainer never see this variable, so the lockdown
            # remains in force everywhere it matters.
            - name: FP_ALLOW_FILE_MODS
              value: "1"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.databaseSecretName" . }}
                  key: {{ include "site.databaseSecretPasswordKey" . }}
            - name: FP_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3AccessKeyKey" . }}
            - name: FP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3SecretKeyKey" . }}
            {{- range $name := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.secretName" $ }}
                  key: {{ $name }}
            {{- end }}
            - name: SITE_TITLE
              value: {{ .Values.siteInstall.title | quote }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminUserKey" . }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminEmailKey" . }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminPasswordKey" . }}
            {{- include "site.smtpEnvFromSecret" . | nindent 12 }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.extraEnvVars "context" $ ) | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.tmp }}
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.data }}
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.config }}
{{- end }}
