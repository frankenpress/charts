{{- /*
Admin install credentials Secret. Auto-generated by `helm install/upgrade`
when siteInstall.autoGenerate is true and no existingSecret is provided.
The lookup() pattern preserves the generated password across re-renders
(matches the keys+salts approach in secret.yaml).
*/ -}}
{{- if and .Values.siteInstall.enabled .Values.siteInstall.autoGenerate (empty .Values.siteInstall.existingSecret) -}}
{{- $installSecret := include "site.siteInstallSecretName" . -}}
{{- $existingInstall := lookup "v1" "Secret" .Release.Namespace $installSecret -}}
{{- $genPassword := .Values.siteInstall.adminPassword | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $installSecret }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  admin_user: {{ if $existingInstall }}{{ index $existingInstall.data "admin_user" }}{{ else }}{{ .Values.siteInstall.adminUser | b64enc | quote }}{{ end }}
  admin_email: {{ if $existingInstall }}{{ index $existingInstall.data "admin_email" }}{{ else }}{{ .Values.siteInstall.adminEmail | b64enc | quote }}{{ end }}
  admin_password: {{ if $existingInstall }}{{ index $existingInstall.data "admin_password" }}{{ else }}{{ $genPassword | b64enc | quote }}{{ end }}
{{- end }}
