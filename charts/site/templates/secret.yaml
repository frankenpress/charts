{{- /*
WordPress keys+salts Secret. Auto-generated by `helm install` if
`keysSalts.autoGenerate` is true and no `keysSalts.existingSecret` is
provided. The 8 random values use Helm's `randAlphaNum` 64 chars; on
upgrade we re-fetch the existing Secret so values aren't rotated.
*/ -}}

{{- if and .Values.keysSalts.autoGenerate (empty .Values.keysSalts.existingSecret) -}}
{{- $secretName := include "site.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $key := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
  {{ $key }}: {{ if $existing }}{{ index $existing.data $key }}{{ else }}{{ randAlphaNum 64 | b64enc | quote }}{{ end }}
  {{- end }}
{{- end }}
{{- /*
External-database password Secret (only when mariadb subchart is off and
we're not using an existingSecret).
*/ -}}
{{- if and (not .Values.mariadb.enabled) (empty .Values.externalDatabase.existingSecret) (not (empty .Values.externalDatabase.password)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
{{- /*
External-cache password Secret (when redis subchart is off and a
password is supplied directly via values).
*/ -}}
{{- if and (not .Values.redis.enabled) (empty .Values.externalCache.existingSecret) (not (empty .Values.externalCache.password)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-cache" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  redis-password: {{ .Values.externalCache.password | b64enc | quote }}
{{- end }}
{{- /*
External-S3 access keys (when minio subchart is off and creds are
supplied directly).
*/ -}}
{{- if and (not .Values.minio.enabled) (empty .Values.externalS3.existingSecret) (or .Values.externalS3.accessKey .Values.externalS3.secretKey) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-s3" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
type: Opaque
data:
  access-key: {{ .Values.externalS3.accessKey | b64enc | quote }}
  secret-key: {{ .Values.externalS3.secretKey | b64enc | quote }}
{{- end }}
