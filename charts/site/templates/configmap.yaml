apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-env" (include "common.names.fullname" .) }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
data:
  WP_ENV: {{ .Values.site.env | quote }}
  WP_HOME: {{ .Values.site.url | quote }}
  WP_SITEURL: {{ printf "%s%s" (.Values.site.url | trimSuffix "/") .Values.site.wpPath | quote }}
  DB_HOST: {{ include "site.databaseHost" . | quote }}
  DB_NAME: {{ include "site.databaseName" . | quote }}
  DB_USER: {{ include "site.databaseUser" . | quote }}
  REDIS_URL: {{ include "site.cacheUrl" . | quote }}
  FP_SOUIN_REDIS_HOST: {{ include "site.cacheHost" . | quote }}
  FP_SOUIN_REDIS_PORT: {{ include "site.cachePort" . | quote }}
  FP_S3_BUCKET: {{ include "site.s3Bucket" . | quote }}
  FP_S3_REGION: {{ include "site.s3Region" . | quote }}
  FP_S3_ENDPOINT: {{ include "site.s3Endpoint" . | quote }}
  {{- if .Values.externalS3.bucketUrl }}
  FP_S3_BUCKET_URL: {{ .Values.externalS3.bucketUrl | quote }}
  {{- end }}
  {{- if .Values.externalS3.objectAcl }}
  # Only emitted when the user opts in. Unset = mu-plugin sends no
  # ACL header on PUT (correct default for "Bucket owner enforced"
  # buckets, which is the AWS new-bucket default since April 2023).
  FP_S3_OBJECT_ACL: {{ .Values.externalS3.objectAcl | quote }}
  {{- end }}
  FP_PORT: "8080"
  FP_METRICS_PORT: "9145"
  # When the wpCron CronJob is enabled, disable WP's in-process pseudo-cron
  # so the two don't fire concurrently. Flipping wpCron.enabled to false
  # automatically re-enables in-process cron — a site without either driver
  # would never run scheduled events.
  DISABLE_WP_CRON: {{ .Values.wpCron.enabled | quote }}
  {{- if .Values.smtp.enabled }}
  # SMTP — consumed by the SMTPMailer mu-plugin component
  # (mu-plugin >=0.5.0). USERNAME / PASSWORD live in
  # `smtp.auth.existingSecret` and are injected into the Deployment,
  # wpcron CronJob, and install Job via secretKeyRef (see
  # `site.smtpEnvFromSecret` helper).
  FP_SMTP_HOST: {{ .Values.smtp.host | quote }}
  FP_SMTP_PORT: {{ .Values.smtp.port | quote }}
  FP_SMTP_ENCRYPTION: {{ .Values.smtp.encryption | quote }}
  {{- if .Values.smtp.fromEmail }}
  FP_SMTP_FROM_EMAIL: {{ .Values.smtp.fromEmail | quote }}
  {{- end }}
  {{- if .Values.smtp.fromName }}
  FP_SMTP_FROM_NAME: {{ .Values.smtp.fromName | quote }}
  {{- end }}
  {{- end }}
