apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy: {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.podLabels "context" $ ) | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pod when ConfigMap or Secret values change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.podAnnotations "context" $ ) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "site.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.syncAdminCredentials .Values.siteInstall.enabled }}
      initContainers:
        # Reconciles wp_users with the admin credentials Secret on every
        # Pod start. Pair with stakater/Reloader (or any controller that
        # rolls the Deployment when the Secret changes) so credential
        # rotation is self-driving end-to-end. Idempotent — see the
        # `syncAdminCredentials` block in values.yaml.
        - name: sync-admin-credentials
          image: {{ include "site.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              WP="wp --allow-root --path=/app/web/wp"

              # Direct mysqli probe — doesn't load WordPress, so it works
              # before `wp core install` has created wp_options on a
              # fresh deploy. (Same probe as job-install.yaml.)
              db_ready() {
                php -r '
                  $m = @new mysqli(
                    getenv("DB_HOST"),
                    getenv("DB_USER"),
                    getenv("DB_PASSWORD")
                  );
                  if ($m->connect_errno) { exit(1); }
                  $m->close();
                ' >/dev/null 2>&1
              }

              echo "[sync-creds] waiting for database..."
              for i in $(seq 1 60); do
                if db_ready; then
                  echo "[sync-creds] db ready (iter=$i)"
                  break
                fi
                sleep 2
              done
              db_ready || {
                echo "[sync-creds] database never became reachable; aborting"
                exit 1
              }

              # Fresh deploy: WP isn't installed yet. The post-install
              # Helm hook Job creates the admin user with the same Secret
              # we'd be syncing from, so there's nothing to reconcile.
              if ! $WP core is-installed >/dev/null 2>&1; then
                echo "[sync-creds] WP not yet installed; skipping (post-install Job will bootstrap)"
                exit 0
              fi

              # Resolve the user we're targeting. Prefer matching by
              # email (survives username changes); fall back to username.
              if $WP user get "$ADMIN_EMAIL" --field=ID >/dev/null 2>&1; then
                TARGET="$ADMIN_EMAIL"
              elif $WP user get "$ADMIN_USER" --field=ID >/dev/null 2>&1; then
                TARGET="$ADMIN_USER"
              else
                echo "[sync-creds] neither ADMIN_EMAIL nor ADMIN_USER resolves to an existing user; aborting"
                exit 1
              fi

              # Idempotency check: compare desired creds against current
              # DB state. With N>1 replicas under the default rolling
              # update (maxSurge:1, maxUnavailable:0), the first Pod to
              # roll wins the write; subsequent Pods see DB-in-sync here
              # and short-circuit. WP fires at most one "Password
              # Changed" notification per rotation.
              DRIFT=$($WP eval '
                $u = get_user_by( "email", getenv("ADMIN_EMAIL") );
                if ( ! $u ) { $u = get_user_by( "login", getenv("ADMIN_USER") ); }
                if ( ! $u ) { echo "drift"; return; }
                $pw_match    = wp_check_password( getenv("ADMIN_PASSWORD"), $u->user_pass, $u->ID );
                $email_match = ( $u->user_email === getenv("ADMIN_EMAIL") );
                $login_match = ( $u->user_login === getenv("ADMIN_USER") );
                echo ( $pw_match && $email_match && $login_match ) ? "match" : "drift";
              ' 2>/dev/null) || DRIFT="drift"

              if [ "$DRIFT" = "match" ]; then
                echo "[sync-creds] DB already in sync with Secret; skipping update"
                exit 0
              fi

              echo "[sync-creds] credential drift detected; running wp user update"

              # `wp user update` triggers WP's password-change notification.
              # When SMTP is configured (FP_SMTP_HOST set), the email
              # actually delivers via the configured server. When it
              # isn't, we drop a tiny filter file and pass --require=
              # to suppress the email entirely — otherwise WP falls
              # through to mail() → /usr/sbin/sendmail (absent in the
              # runtime image) and emits a noisy "sendmail: not found"
              # line on every credential sync.
              if [ -n "${FP_SMTP_HOST:-}" ]; then
                REQUIRE_FLAG=""
              else
                # `--require=` files are loaded during wp-cli bootstrap,
                # before WordPress — so `add_filter` isn't defined yet.
                # Defer registration via `WP_CLI::add_hook('after_wp_load', ...)`.
                cat > /tmp/no-user-emails.php <<'PHP'
              <?php
              WP_CLI::add_hook( 'after_wp_load', function() {
                  add_filter( 'send_password_change_email', '__return_false' );
                  add_filter( 'send_email_change_email',    '__return_false' );
              });
              PHP
                REQUIRE_FLAG="--require=/tmp/no-user-emails.php"
              fi

              # shellcheck disable=SC2086 -- intentional word-split on REQUIRE_FLAG
              $WP $REQUIRE_FLAG user update "$TARGET" \
                --user_pass="$ADMIN_PASSWORD" \
                --user_email="$ADMIN_EMAIL"

              echo "[sync-creds] done"
          envFrom:
            - configMapRef:
                name: {{ printf "%s-env" (include "common.names.fullname" .) }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ tpl .Values.extraEnvVarsCM . }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ tpl .Values.extraEnvVarsSecret . }}
            {{- end }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.databaseSecretName" . }}
                  key: {{ include "site.databaseSecretPasswordKey" . }}
            - name: FP_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3AccessKeyKey" . }}
            - name: FP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3SecretKeyKey" . }}
            {{- range $name := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.secretName" $ }}
                  key: {{ $name }}
            {{- end }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminUserKey" . }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminEmailKey" . }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.siteInstallSecretName" . }}
                  key: {{ include "site.siteInstallAdminPasswordKey" . }}
            {{- include "site.smtpEnvFromSecret" . | nindent 12 }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.extraEnvVars "context" $ ) | nindent 12 }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      {{- end }}
      containers:
        - name: site
          image: {{ include "site.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9145
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ printf "%s-env" (include "common.names.fullname" .) }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ tpl .Values.extraEnvVarsCM . }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ tpl .Values.extraEnvVarsSecret . }}
            {{- end }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.databaseSecretName" . }}
                  key: {{ include "site.databaseSecretPasswordKey" . }}
            {{- if and (not .Values.redis.enabled) (or .Values.externalCache.password .Values.externalCache.existingSecret) }}
            - name: FP_SOUIN_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalCache.existingSecret }}{{ tpl .Values.externalCache.existingSecret . }}{{ else }}{{ printf "%s-cache" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}{{ end }}
                  key: {{ .Values.externalCache.existingSecretPasswordKey | default "redis-password" }}
            {{- end }}
            - name: FP_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3AccessKeyKey" . }}
            - name: FP_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.s3SecretName" . }}
                  key: {{ include "site.s3SecretKeyKey" . }}
            {{- range $name := list "AUTH_KEY" "SECURE_AUTH_KEY" "LOGGED_IN_KEY" "NONCE_KEY" "AUTH_SALT" "SECURE_AUTH_SALT" "LOGGED_IN_SALT" "NONCE_SALT" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "site.secretName" $ }}
                  key: {{ $name }}
            {{- end }}
            {{- include "site.smtpEnvFromSecret" . | nindent 12 }}
            {{- if .Values.extraEnvVars }}
            {{- include "common.tplvalues.render" ( dict "value" .Values.extraEnvVars "context" $ ) | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe: {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe: {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.tmp }}
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.data }}
        - name: config
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfsSize.config }}
