# Default values for site.
# This file is documented Bitnami-style: every public value carries
# `## @param <path> <description>` annotations so README generators can
# emit a consistent reference table.

## @section Global parameters
## Global Docker image parameters that override values in subcharts.

## @param global.imageRegistry Global Docker image registry
## @param global.imagePullSecrets Global Docker registry secret names as an array
## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
##
global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClass: ""

## @section Common parameters

## @param kubeVersion Override Kubernetes version
## @param nameOverride String to partially override common.names.fullname
## @param fullnameOverride String to fully override common.names.fullname
## @param clusterDomain Kubernetes cluster domain name
## @param commonLabels Labels to add to all deployed objects
## @param commonAnnotations Annotations to add to all deployed objects
## @param extraDeploy Array of extra objects to deploy with the release
##
kubeVersion: ""
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
commonLabels: {}
commonAnnotations: {}
extraDeploy: []

## @section FrankenPress site image
## The site image you built from site-template (or your fork of it).

## @param image.registry [default: REGISTRY_NAME] Site image registry
## @param image.repository [default: REPOSITORY_NAME/site] Site image repository
## @skip image.tag Site image tag (immutable tags are recommended). Defaults to chart appVersion
## @param image.digest Site image digest in the way sha256:aaaa...
## @param image.pullPolicy Site image pull policy
## @param image.pullSecrets Site image pull secrets
##
image:
  registry: ghcr.io
  repository: frankenpress/site-template
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section Site configuration

## @param site.url Public URL of the site (no trailing slash). Used to set WP_HOME and WP_SITEURL
## @param site.env WP_ENV value — `development`, `staging`, or `production`
## @param site.wpPath Path under site.url where WordPress core lives. Bedrock convention is `/wp`
##
site:
  url: "http://site.localhost"
  env: production
  wpPath: /wp

## @section WordPress auth keys + salts
## Eight constants WP requires for cookie/nonce signing. The chart can
## auto-generate them on first install via a one-shot Job (default), or
## you can point at an existing Secret.

## @param keysSalts.autoGenerate If true, install a Job that creates the keys+salts Secret if it doesn't exist
## @param keysSalts.existingSecret Pre-existing Secret with the 8 keys/salts (overrides auto-generate)
##
keysSalts:
  autoGenerate: true
  existingSecret: ""

## @section First-time install
## A post-install/post-upgrade Helm hook Job runs `wp core install`
## (idempotent via `wp core is-installed`) and `wp core update-db`. Admin
## credentials come from an auto-generated Secret unless `existingSecret`
## is set. Reconciling wp_users on rotation is handled separately by the
## `syncAdminCredentials` initContainer on the Deployment (see below) —
## that path is Pod-lifecycle-driven, so Reloader rolling on a Secret
## change naturally re-syncs without needing a Helm upgrade.

## @param siteInstall.enabled Run wp core install on first deploy
## @param siteInstall.title Site title shown in wp-admin
## @param siteInstall.adminUser Admin username (when autoGenerate)
## @param siteInstall.adminEmail Admin email (when autoGenerate)
## @param siteInstall.adminPassword Admin password (leave empty to generate)
## @param siteInstall.autoGenerate Manage admin credentials in a chart-rendered Secret
## @param siteInstall.existingSecret Pre-existing Secret with admin credentials (any source: manual, ESO, Sealed Secrets, etc.)
## @param siteInstall.existingSecretAdminUserKey Key in existingSecret holding the admin username
## @param siteInstall.existingSecretAdminEmailKey Key in existingSecret holding the admin email
## @param siteInstall.existingSecretAdminPasswordKey Key in existingSecret holding the admin password
## @param siteInstall.skipEmail Pass --skip-email to wp core install (avoid first-login email)
## @param siteInstall.backoffLimit Job backoffLimit (retries before failure)
## @param siteInstall.activeDeadlineSeconds Hard deadline for the install Job
## @param siteInstall.activeTheme Theme slug to activate after `wp core install` (e.g. `dt-the7`). Empty leaves whatever WP defaults to. Idempotent on re-run.
## @param siteInstall.postDeployCommands List of raw wp-cli sub-commands run after `activeTheme` on every install + upgrade. Each entry is passed verbatim to `wp --path=/app/web/wp <entry>`. Use for theme-specific post-activation hooks (e.g. The7 dynamic-CSS regen). Run in declared order; a non-zero exit fails the Job loudly but does NOT roll back the Deployment.
## @param siteInstall.ttlSecondsAfterFinished How long to keep completed install Jobs before Kubernetes garbage-collects them. Each chart-version / image-tag / siteInstall change creates a new hash-named Job; this controls how long old ones stick around for log inspection. 7 days by default.
##
siteInstall:
  enabled: true
  title: "FrankenPress site"
  adminUser: "admin"
  adminEmail: "admin@example.com"
  adminPassword: ""
  autoGenerate: true
  existingSecret: ""
  existingSecretAdminUserKey: "admin_user"
  existingSecretAdminEmailKey: "admin_email"
  existingSecretAdminPasswordKey: "admin_password"
  skipEmail: true
  backoffLimit: 6
  activeDeadlineSeconds: 600
  activeTheme: ""
  postDeployCommands: []
  ttlSecondsAfterFinished: 604800

## @section Admin credential sync (rotation)
## An initContainer on every site Pod that reads admin user/email/password
## from the install Secret and reconciles wp_users to match. Combined with
## a controller that rolls the Deployment when the Secret changes (e.g.
## stakater/Reloader watching the auto-generated `<release>-site-install`
## Secret, or a user-supplied `existingSecret`), credential rotation
## becomes self-driving end-to-end:
##
##   external rotation → Secret updated → Reloader rolls Deployment →
##     initContainer detects drift → wp user update → DB in sync
##
## The initContainer is idempotent: it short-circuits when the DB hash
## already matches the Secret value (via `wp_check_password`) and the
## stored email already matches. With N>1 replicas under the default
## rolling update, only the first Pod to roll runs `wp user update` —
## subsequent Pods see the DB in sync and exit early, so a single
## rotation produces at most one DB write and at most one WP-emitted
## "Password Changed" notification.
##
## The first-install path is unaffected: `wp core install` still runs in
## the post-install Helm hook Job and is the only place the initial
## admin user is created.

## @param syncAdminCredentials Run an initContainer on every site Pod that syncs admin_user/admin_email/admin_password from the install Secret into wp_users. Idempotent — only writes on drift, so multi-replica rollouts don't fire duplicate change notifications. Set false to manage the WP admin user out-of-band.
##
syncAdminCredentials: true

## @section Replicas + scheduling

## @param replicaCount Number of WP pod replicas
## @param updateStrategy.type Site deployment update strategy
## @param updateStrategy.rollingUpdate.maxSurge Max surge during rolling update
## @param updateStrategy.rollingUpdate.maxUnavailable Max unavailable during rolling update
## @param revisionHistoryLimit Old ReplicaSets to retain for `kubectl rollout undo`. Default 3 (current + 2 previous). The k8s default of 10 leaves a long tail of zero-replica ReplicaSets in long-lived namespaces. `helm rollback` and image-tag-pinned re-deploys are the canonical rollback paths in this stack, so a deeper k8s-side history isn't load-bearing.
##
replicaCount: 1
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
revisionHistoryLimit: 3

## @param podLabels Extra labels for the site pods
## @param podAnnotations Extra annotations for the site pods
## @param nodeSelector Node labels for pod assignment
## @param tolerations Tolerations for pod assignment
## @param affinity Affinity for pod assignment
## @param topologySpreadConstraints Topology spread constraints for the site pod
## @param priorityClassName Pod priority class name
##
podLabels: {}
## Caddy emits JSON access logs to stdout on the public port; PHP/WP errors
## go to stderr. Cluster-side shippers (Vector, Grafana Alloy, Fluent Bit)
## tail container streams without any pod-level config. Datadog Agent's
## log autodiscovery uses pod annotations — example for the `site` container:
##
##   podAnnotations:
##     ad.datadoghq.com/site.logs: |
##       [{"source": "caddy", "service": "site"}]
##
## Full integration guide: https://docs.frankenpress.com/operations/logging
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

## @section Resources + probes

## @param resources.requests.cpu CPU request for the site container
## @param resources.requests.memory Memory request for the site container
## @param resources.limits.cpu CPU limit for the site container
## @param resources.limits.memory Memory limit for the site container
##
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

## @param livenessProbe.enabled Enable liveness probe
## @param livenessProbe.httpGet.path HTTP path for liveness probe
## @param livenessProbe.httpGet.port HTTP port for liveness probe
## @param livenessProbe.initialDelaySeconds Initial delay
## @param livenessProbe.periodSeconds Period
## @param livenessProbe.timeoutSeconds Timeout
## @param livenessProbe.failureThreshold Failure threshold
##
livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

## @param readinessProbe.enabled Enable readiness probe
## @param readinessProbe.httpGet.path HTTP path for readiness probe
## @param readinessProbe.httpGet.port HTTP port for readiness probe
##
readinessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

## @section Security context (production-grade defaults)

## @param podSecurityContext.runAsNonRoot Run pod as non-root
## @param podSecurityContext.runAsUser User ID to run pod as (33 = www-data)
## @param podSecurityContext.fsGroup Filesystem group
## @param podSecurityContext.seccompProfile.type Seccomp profile type (`RuntimeDefault` satisfies PSA `restricted:latest`)
##
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 33
  fsGroup: 33
  seccompProfile:
    type: RuntimeDefault

## @param containerSecurityContext.runAsNonRoot Run container as non-root
## @param containerSecurityContext.runAsUser User to run container as
## @param containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation
## @param containerSecurityContext.readOnlyRootFilesystem Read-only root filesystem
## @param containerSecurityContext.capabilities.drop Capabilities to drop
##
## These defaults satisfy PodSecurity Standard `restricted:latest` without
## additional overrides. The pair (`allowPrivilegeEscalation: false`,
## `capabilities.drop: [ALL]`) is safe because the FrankenPHP binary in
## runtime ships *without* the `cap_net_bind_service=ep` file capability
## — stripped by `setcap -r` in runtime's Dockerfile, since `FP_PORT`
## defaults to 8080 (no low-port bind). If you build a custom runtime image
## that re-adds the file cap, the kernel's `no_new_privs` flag (set when
## `allowPrivilegeEscalation: false`) will refuse to exec it. In that case,
## override in your values: `containerSecurityContext.allowPrivilegeEscalation: true`
## and `containerSecurityContext.capabilities.add: [NET_BIND_SERVICE]`.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 33
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## @section Service

## @param service.type Service type
## @param service.ports.http HTTP service port
## @param service.ports.metrics Prometheus metrics service port
## @param service.clusterIP Static cluster IP (use `None` for headless)
## @param service.annotations Service annotations
##
service:
  type: ClusterIP
  ports:
    http: 80
    metrics: 9145
  clusterIP: ""
  annotations: {}

## @section Ingress (optional)

## @param ingress.enabled Enable Ingress controller resource
## @param ingress.className IngressClassName
## @param ingress.hostname Hostname (e.g. mysite.example.com)
## @param ingress.path Path under the hostname
## @param ingress.pathType Path type (`Prefix`, `Exact`, etc.)
## @param ingress.annotations Ingress annotations
## @param ingress.tls Enable TLS — set to `true` to add a tls section using `ingress.hostname`
##
ingress:
  enabled: false
  className: ""
  hostname: site.localhost
  path: /
  pathType: Prefix
  annotations: {}
  tls: false

## @section Gateway API HTTPRoute (optional)

## @param httpRoute.enabled Enable Gateway API HTTPRoute
## @param httpRoute.parentRefs Parent Gateway references (array of {name, namespace, sectionName, port})
## @param httpRoute.hostnames Hostnames the route matches
##
httpRoute:
  enabled: false
  parentRefs: []
  hostnames: []

## @section ServiceAccount

## @param serviceAccount.create Create a ServiceAccount for the site pod
## @param serviceAccount.name ServiceAccount name (auto-derived if empty)
## @param serviceAccount.annotations ServiceAccount annotations (e.g. IRSA)
## @param serviceAccount.automountServiceAccountToken Automount the SA token
##
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

## @section SMTP (optional, transport-agnostic mail delivery)
##
## The runtime image ships no MTA, so PHP's `mail()` fails silently
## and `wp_mail()` returns true while no email actually delivers. Set
## `smtp.enabled=true` and provide a Secret containing SMTP auth
## credentials to wire the global PHPMailer (via the SMTPMailer mu-plugin
## component, mu-plugin >=0.5.0) to send through any SMTP server —
## Postmark, SendGrid, Mailgun, AWS SES, in-cluster relay, etc.
##
## When `smtp.enabled=false` (default), no `FP_SMTP_*` env is injected
## and the syncAdminCredentials initContainer suppresses WordPress's
## password-change email (which would otherwise emit a benign-but-noisy
## "sendmail: not found" line on every credential sync). When
## `smtp.enabled=true`, the change notification actually delivers via
## the configured server.

## @param smtp.enabled Wire SMTP into wp_mail(). Requires `smtp.host` and `smtp.auth.existingSecret`. Sites built from `site-template` v0.2.4+ honour this; older images ignore it.
## @param smtp.host SMTP server hostname (e.g. `smtp.postmarkapp.com`)
## @param smtp.port TCP port (587 STARTTLS, 465 implicit TLS, 25 plaintext — don't)
## @param smtp.encryption `tls` (STARTTLS), `ssl` (implicit TLS), `none` (local dev only)
## @param smtp.fromEmail `wp_mail_from` filter target. Empty → WP `admin_email` option.
## @param smtp.fromName `wp_mail_from_name` filter target. Empty → WP `blogname` option.
## @param smtp.auth.existingSecret Name of a Secret holding SMTP `username` and `password`. Required when `smtp.enabled=true`.
## @param smtp.auth.usernameKey Key inside the Secret for the SMTP username
## @param smtp.auth.passwordKey Key inside the Secret for the SMTP password
##
smtp:
  enabled: false
  host: ""
  port: 587
  encryption: tls
  fromEmail: ""
  fromName: ""
  auth:
    existingSecret: ""
    usernameKey: username
    passwordKey: password

## @section ServiceMonitor (optional, prometheus-operator)

## @param serviceMonitor.enabled Render a ServiceMonitor for prometheus-operator. Requires the `monitoring.coreos.com/v1` CRD on the cluster — the template self-gates on `Capabilities.APIVersions`, so leaving this on for clusters without the CRD is safe but renders nothing.
## @param serviceMonitor.namespace Namespace for the ServiceMonitor (defaults to the release namespace)
## @param serviceMonitor.interval Scrape interval
## @param serviceMonitor.scrapeTimeout Per-scrape timeout
## @param serviceMonitor.labels Extra labels for the ServiceMonitor (used by your Prometheus operator's `serviceMonitorSelector`)
##
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

## @section Horizontal Pod Autoscaling (optional)

## @param autoscaling.enabled Enable HPA
## @param autoscaling.minReplicas Min replicas
## @param autoscaling.maxReplicas Max replicas
## @param autoscaling.targetCPUUtilizationPercentage Target CPU utilisation
## @param autoscaling.targetMemoryUtilizationPercentage Target memory utilisation
##
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

## @section wp-cron CronJob

## @param wpCron.enabled Enable the WP cron CronJob. When true, the chart also sets DISABLE_WP_CRON=true on the site so the in-process pseudo-cron doesn't fire alongside it (the two settings are coupled). Disable to fall back to WP's request-triggered cron.
## @param wpCron.schedule Cron schedule
## @param wpCron.successfulJobsHistoryLimit Number of successful job pods to retain
## @param wpCron.failedJobsHistoryLimit Number of failed job pods to retain
## @param wpCron.concurrencyPolicy `Allow`, `Forbid`, or `Replace`
##
wpCron:
  enabled: true
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid

## @section Extra environment variables
## Extend without modifying the chart. Useful for site-specific env.

## @param extraEnvVars Array of extra env vars passed to the site pod
## @param extraEnvVarsCM Name of a ConfigMap to load extra env vars from
## @param extraEnvVarsSecret Name of a Secret to load extra env vars from
##
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

## @section Filesystem
## The site image is read-only at the root; tmpfs mounts are required
## for the writable paths runtime expects:
##   /tmp     — PHP scratch
##   /data    — XDG_DATA_HOME (Caddy data + TLS storage)
##   /config  — XDG_CONFIG_HOME (Caddy autosave.json)

## @param tmpfsSize.tmp Size of the /tmp tmpfs
## @param tmpfsSize.data Size of the /data tmpfs (Caddy data, XDG_DATA_HOME)
## @param tmpfsSize.config Size of the /config tmpfs (Caddy autosave, XDG_CONFIG_HOME)
##
tmpfsSize:
  tmp: 256Mi
  data: 64Mi
  config: 16Mi

## @section MariaDB subchart (bitnami/mariadb)
## **Default-enabled for instant on-cluster deploy. NOT recommended for
## production** — use mariadb-operator (https://github.com/mariadb-operator/mariadb-operator)
## or a managed RDS-style service for production. When `mariadb.enabled`
## is `false`, set `externalDatabase.*` instead.

mariadb:
  ## @param mariadb.enabled Deploy a MariaDB sidecar via the bitnami/mariadb subchart
  enabled: true
  # See note on bitnamilegacy in the minio block above.
  image:
    registry: docker.io
    repository: bitnamilegacy/mariadb
    pullPolicy: IfNotPresent
  auth:
    rootPassword: ""
    database: wordpress
    username: wordpress
    password: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi

## @section External database (when mariadb.enabled = false)

## @param externalDatabase.host External DB host
## @param externalDatabase.port External DB port
## @param externalDatabase.database Database name
## @param externalDatabase.user Database user
## @param externalDatabase.password Database password (use existingSecret in production)
## @param externalDatabase.existingSecret Pre-existing Secret containing the password
## @param externalDatabase.existingSecretPasswordKey Key in the Secret holding the password
##
externalDatabase:
  host: ""
  port: 3306
  database: wordpress
  user: wordpress
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: mariadb-password

## @section Redis subchart (bitnami/redis) — Souin HTTP cache backend
## **Default-enabled for instant on-cluster deploy. For production use
## the DragonflyDB Operator** (https://github.com/dragonflydb/dragonfly-operator) —
## same RESP protocol, dramatically better single-node throughput. Set
## `redis.enabled: false` and point `externalCache.*` at the Dragonfly
## Service.

redis:
  ## @param redis.enabled Deploy a Redis sidecar via the bitnami/redis subchart
  enabled: true
  architecture: standalone
  # See note on bitnamilegacy in the minio block above.
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    pullPolicy: IfNotPresent
  auth:
    enabled: false
  master:
    persistence:
      enabled: false  # Souin cache is regenerable; persistence costs ops without value

## @section External cache (when redis.enabled = false)

## @param externalCache.host External Redis-compatible host (DragonflyDB Operator endpoint, etc.)
## @param externalCache.port External cache port
## @param externalCache.password Password (or set existingSecret)
## @param externalCache.existingSecret Pre-existing Secret with the password
## @param externalCache.existingSecretPasswordKey Key in the Secret
##
externalCache:
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password

## @section MinIO subchart (bitnami/minio) — S3-compatible object storage
## **Default-enabled for instant on-cluster deploy. For production use
## AWS S3** (or any S3-compatible: R2, GCS XML, etc.) and set
## `minio.enabled: false` + `externalS3.*`.

minio:
  ## @param minio.enabled Deploy a MinIO sidecar via the bitnami/minio subchart
  enabled: true
  # Bitnami moved their public images to `bitnamilegacy/*` in 2025
  # ("Bitnami Secure Images" commercial pivot — the previous
  # `bitnami/minio` tags were withdrawn from free Docker Hub). Override
  # every Bitnami image the chart references to the legacy mirror.
  image:
    registry: docker.io
    repository: bitnamilegacy/minio
    pullPolicy: IfNotPresent
  clientImage:
    registry: docker.io
    repository: bitnamilegacy/minio-client
  console:
    image:
      registry: docker.io
      repository: bitnamilegacy/minio-object-browser
  provisioning:
    image:
      registry: docker.io
      repository: bitnamilegacy/os-shell
  auth:
    rootUser: minio
    rootPassword: ""
  defaultBuckets: site-media
  persistence:
    enabled: true
    size: 8Gi

## @section External S3-compatible storage (when minio.enabled = false)

## @param externalS3.bucket S3 bucket name
## @param externalS3.region S3 region
## @param externalS3.endpoint Custom endpoint URL (leave empty for AWS S3; set for R2 / GCS XML / MinIO)
## @param externalS3.bucketUrl Public URL clients use to fetch media (CDN URL or bucket URL)
## @param externalS3.objectAcl S3 object ACL applied on PUT (`public-read`, `private`, `authenticated-read`). Leave empty for buckets with Object Ownership = "Bucket owner enforced" (the AWS default for new buckets since April 2023). Sending an ACL on such a bucket aborts uploads mid-PUT and leaves 0-byte objects behind.
## @param externalS3.accessKey Access key id (or use existingSecret)
## @param externalS3.secretKey Secret access key (or use existingSecret)
## @param externalS3.existingSecret Pre-existing Secret with `access-key` and `secret-key` keys
##
externalS3:
  bucket: site-media
  region: us-east-1
  endpoint: ""
  bucketUrl: ""
  objectAcl: ""
  accessKey: ""
  secretKey: ""
  existingSecret: ""
