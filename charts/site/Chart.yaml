apiVersion: v2
name: site
description: FrankenPress WordPress site — Caddy + FrankenPHP + Souin (HTTP cache) + humanmade/s3-uploads (media offload). Deploys a single site image (built from site-template) plus optional in-cluster MariaDB / Redis / MinIO subcharts for instant on-cluster deployment.
type: application
icon: https://frankenpress.com/icon.png

# Chart version. Bumped on every change to templates / values / Chart.yaml.
version: 0.12.0

# Application version. Tracks the site-template release we test against.
appVersion: "0.6.0"

kubeVersion: ">=1.27.0-0"

keywords:
  - wordpress
  - frankenphp
  - caddy
  - souin
  - s3
  - bedrock

home: https://github.com/frankenpress/charts
sources:
  - https://github.com/frankenpress/charts
  - https://github.com/frankenpress/runtime
  - https://github.com/frankenpress/mu-plugin
  - https://github.com/frankenpress/site-template

maintainers:
  - name: FrankenPress.
    email: hello@frankenpress.com
    url: https://frankenpress.com

annotations:
  # Used by ArtifactHub-style consumers.
  category: CMS
  licenses: Apache-2.0

# Dependencies.
#
# All Bitnami subcharts (mariadb, minio, redis) are conditional and
# default-enabled for instant on-cluster deployment. **They are not
# recommended for production** — see chart README for the production
# topology (DragonflyDB Operator + MariaDB Operator + AWS S3).
#
# `common` is a library chart and always loads (provides Bitnami's
# helper templates: common.names.fullname, common.labels.standard, etc.).
dependencies:
  - name: common
    version: 2.38.0
    repository: oci://registry-1.docker.io/bitnamicharts
    tags:
      - bitnami-common

  - name: mariadb
    version: 25.0.10
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: mariadb.enabled

  - name: redis
    version: 25.4.1
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled

  - name: minio
    version: 17.0.21
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: minio.enabled

  # Bitnami withdrew the `bitnami/<x>` images from free public Docker
  # Hub in 2025 (their "Secure Images" commercial pivot). They mirror
  # the previous tags at `bitnamilegacy/<x>` for the time being. Our
  # values.yaml overrides each subchart's image registry/repository to
  # `docker.io/bitnamilegacy/<x>` by default. Production users supply
  # their own external services and disable the subcharts entirely.
