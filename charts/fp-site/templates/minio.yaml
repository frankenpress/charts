{{- if .Values.minio.enabled -}}
{{- $name := printf "%s-minio" (include "common.names.fullname" .) -}}
{{- $secretName := $name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $rootUser := .Values.minio.auth.rootUser | default "minio" -}}
{{- $rootPassword := .Values.minio.auth.rootPassword -}}
{{- if not $rootPassword }}
{{- $rootPassword = (randAlphaNum 24) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio") .Values.commonLabels) "context" $ ) | nindent 4 }}
type: Opaque
data:
  root-user: {{ if $existing }}{{ index $existing.data "root-user" }}{{ else }}{{ $rootUser | b64enc | quote }}{{ end }}
  root-password: {{ if $existing }}{{ index $existing.data "root-password" }}{{ else }}{{ $rootPassword | b64enc | quote }}{{ end }}
---
{{- if .Values.minio.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio") .Values.commonLabels) "context" $ ) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
  {{- if .Values.global.defaultStorageClass }}
  storageClassName: {{ .Values.global.defaultStorageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio") .Values.commonLabels) "context" $ ) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" (dict "app.kubernetes.io/component" "minio") "context" $ ) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio") .Values.commonLabels) "context" $ ) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" (dict "app.kubernetes.io/component" "minio") "context" $ ) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio") .Values.commonLabels) "context" $ ) | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-password
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
# Bucket-bootstrap Job — runs once after MinIO is ready, creates the
# default bucket. helm-hook ensures it runs after the install.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-init" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio-init") .Values.commonLabels) "context" $ ) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 6
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" (merge (dict "app.kubernetes.io/component" "minio-init") .Values.commonLabels) "context" $ ) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # Wait for MinIO to be reachable. The Deployment's readiness
              # probe should make this fast, but be defensive.
              until /usr/bin/mc alias set fp http://{{ $name }}:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for minio..."; sleep 2;
              done
              /usr/bin/mc mb --ignore-existing fp/{{ .Values.minio.defaultBuckets }}
              /usr/bin/mc anonymous set download fp/{{ .Values.minio.defaultBuckets }}
              echo "minio bootstrap complete"
{{- end }}
